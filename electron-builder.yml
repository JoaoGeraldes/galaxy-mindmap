# How `npm run package` turns the app into installers; see the README's
# "Desktop app" section. Options: https://www.electron.build/configuration
appId: com.joaogeraldes.galaxymindmap
productName: Galaxy Mind Map
directories:
  output: release
# Only what the packaged app runs: the built page, the Electron code and
# the MCP server for AI assistants.
files:
  - dist/**
  - electron/**
  - build/mcp/**
  - package.json
# Kept outside the app's archive so AI apps can run the server directly.
asarUnpack:
  - build/mcp/**
win:
  target: nsis
  icon: electron/icon.png
mac:
  target: dmg
  icon: electron/icon.png
  category: public.app-category.productivity
linux:
  target: AppImage
  icon: electron/icon.png
  category: Office
